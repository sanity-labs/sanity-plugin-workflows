name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm run --if-present test

  compatibility:
    name: Sanity ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 5
            node: 22.12.0
            sanity: 5.31.1
            sanityUi: 3.2.0
          - name: 6.2
            node: 22.12.0
            sanity: 6.2.0
            sanityUi: 3.2.0
          - name: current-6
            node: 24.14.0
            sanity: ^6.0.0
            sanityUi: ^4.0.0
    steps:
      - uses: actions/checkout@v6
        with:
          path: workflows
      - uses: actions/checkout@v6
        with:
          repository: sanity-labs/workflow-kit
          path: workflow-kit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            workflows/pnpm-lock.yaml
            workflow-kit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: workflow-kit
      - run: pnpm install --frozen-lockfile
        working-directory: workflows
      - run: pnpm smoke:compat
        working-directory: workflows
        env:
          SANITY_VERSION: ${{ matrix.sanity }}
          SANITY_UI_VERSION: ${{ matrix.sanityUi }}
          WORKFLOW_KIT_ROOT: ../workflow-kit
